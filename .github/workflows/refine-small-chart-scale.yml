name: Ajustar escalas pequeñas

on:
  push:
    branches:
      - main
    paths:
      - scripts/refine_small_scale.py
      - .github/workflows/refine-small-chart-scale.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar parche
        run: python3 scripts/refine_small_scale.py

      - name: Validar JavaScript
        run: node --check app.js

      - name: Publicar cambio
        run: |
          rm scripts/refine_small_scale.py
          rm .github/workflows/refine-small-chart-scale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/refine_small_scale.py .github/workflows/refine-small-chart-scale.yml
          git commit -m "Refina escalas pequeñas de la gráfica"
          git push
