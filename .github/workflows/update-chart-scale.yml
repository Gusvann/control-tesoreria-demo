name: Ajustar escala de la gráfica

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-chart-scale.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart-scale:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Reemplazar lógica de escala
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          replacement = r'''function niceCeiling(value) {
            if (!Number.isFinite(value) || value <= 0) {
              return 5000;
            }

            const exponent = Math.floor(Math.log10(value));
            const magnitude = 10 ** exponent;
            const fraction = value / magnitude;
            let niceFraction;

            if (fraction <= 1) {
              niceFraction = 1;
            } else if (fraction <= 2) {
              niceFraction = 2;
            } else if (fraction <= 5) {
              niceFraction = 5;
            } else {
              niceFraction = 10;
            }

            return niceFraction * magnitude;
          }

          function getMovementScaleStep(maxMovement) {
            if (maxMovement <= 1000) {
              return 5000;
            }
            if (maxMovement <= 5000) {
              return 10000;
            }
            if (maxMovement <= 10000) {
              return 20000;
            }
            if (maxMovement <= 20000) {
              return 50000;
            }
            if (maxMovement <= 50000) {
              return 100000;
            }

            return niceCeiling(maxMovement * 1.5);
          }

          function getChartScale(series) {
            const balances = series.map((point) => point.balance);
            const movementAmounts = series.flatMap((point) =>
              point.movements.map((movement) => Math.abs(movement.amount)),
            );

            const minBalance = Math.min(...balances, 0);
            const maxBalance = Math.max(...balances, 0);
            const maxAbsoluteBalance = Math.max(Math.abs(minBalance), Math.abs(maxBalance));
            const maxMovement = Math.max(...movementAmounts, 0);

            const movementStep = getMovementScaleStep(maxMovement);
            const balanceStep = maxAbsoluteBalance > 0 ? niceCeiling(maxAbsoluteBalance / 1.8) : 5000;
            const innerStep = Math.max(5000, movementStep, balanceStep);
            const outerBound = innerStep * 2;

            if (minBalance < 0 && maxBalance > 0) {
              return {
                yMin: -outerBound,
                yMax: outerBound,
                tickValues: [outerBound, innerStep, 0, -innerStep, -outerBound],
              };
            }

            if (minBalance < 0) {
              return {
                yMin: -outerBound,
                yMax: 0,
                tickValues: [0, -innerStep, -outerBound],
              };
            }

            return {
              yMin: 0,
              yMax: outerBound,
              tickValues: [outerBound, innerStep, 0],
            };
          }

          function formatChartAxisValue(value) {
            if (Math.abs(value) >= 1000000) {
              return compactCurrency.format(value);
            }

            return currency.format(value);
          }

          function renderChart(series) {
            const width = 1000;
            const height = 340;
            const margin = { top: 24, right: 24, bottom: 48, left: 92 };
            const plotWidth = width - margin.left - margin.right;
            const plotHeight = height - margin.top - margin.bottom;
            const { yMin, yMax, tickValues } = getChartScale(series);

            const x = (day) => margin.left + (day / state.horizon) * plotWidth;
            const y = (balance) => margin.top + ((yMax - balance) / (yMax - yMin || 1)) * plotHeight;

            const linePath = series
              .map((point, index) => `${index === 0 ? "M" : "L"} ${x(point.day).toFixed(2)} ${y(point.balance).toFixed(2)}`)
              .join(" ");

            const zeroLineY = y(0);
            const areaPath = `${linePath} L ${x(state.horizon)} ${zeroLineY} L ${x(0)} ${zeroLineY} Z`;

            const gridLines = tickValues
              .map((value) => {
                const yPosition = y(value);
                return `
                  <line class="chart-grid-line" x1="${margin.left}" y1="${yPosition}" x2="${width - margin.right}" y2="${yPosition}" />
                  <text class="chart-axis-label" x="${margin.left - 12}" y="${yPosition + 4}" text-anchor="end">${formatChartAxisValue(value)}</text>
                `;
              })
              .join("");

            const preferredLabels = state.horizon === 7 ? 7 : state.horizon === 14 ? 7 : 6;
            const xTickStep = Math.max(1, Math.round(state.horizon / preferredLabels));
            const xLabels = series
              .filter((point) => point.day === 0 || point.day === state.horizon || point.day % xTickStep === 0)
              .map(
                (point) => `
                  <text class="chart-axis-label" x="${x(point.day)}" y="${height - 16}" text-anchor="middle">
                    ${point.day === 0 ? "Hoy" : shortDate.format(point.date)}
                  </text>
                `,
              )
              .join("");

            const eventMarkers = series
              .filter((point) => point.movements.length > 0)
              .map((point) => {
                const hasInflow = point.movements.some((movement) => movement.type === "inflow");
                const hasOutflow = point.movements.some((movement) => movement.type === "outflow");
                const markers = [];

                if (hasInflow) {
                  markers.push(`<circle class="chart-event-in" cx="${x(point.day)}" cy="${y(point.balance) - 13}" r="5" />`);
                }
                if (hasOutflow) {
                  markers.push(`<circle class="chart-event-out" cx="${x(point.day)}" cy="${y(point.balance) + 13}" r="5" />`);
                }
                return markers.join("");
              })
              .join("");

            const points = series
              .filter((point) => point.day === 0 || point.day === state.horizon || point.movements.length > 0)
              .map((point) => `<circle class="chart-point" cx="${x(point.day)}" cy="${y(point.balance)}" r="5" />`)
              .join("");

            els.forecastChart.innerHTML = `
              <defs>
                <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#2463db" stop-opacity="0.20" />
                  <stop offset="100%" stop-color="#2463db" stop-opacity="0.02" />
                </linearGradient>
              </defs>
              ${gridLines}
              <line class="chart-today-line" x1="${x(0)}" y1="${margin.top}" x2="${x(0)}" y2="${margin.top + plotHeight}" />
              <path class="chart-area" d="${areaPath}" />
              <path class="chart-line" d="${linePath}" />
              ${points}
              ${eventMarkers}
              ${xLabels}
            `;
          }

          '''

          pattern = re.compile(
              r'function renderChart\(series\) \{.*?\n\}\n\n(?=function renderDashboard\(\) \{)',
              re.DOTALL,
          )
          updated, count = pattern.subn(lambda _: replacement, text, count=1)

          if count != 1:
              raise SystemExit("No se encontró exactamente un bloque renderChart para reemplazar.")

          path.write_text(updated, encoding="utf-8")

          workflow_path = Path(".github/workflows/update-chart-scale.yml")
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta la escala dinámica de la gráfica"
          git push
