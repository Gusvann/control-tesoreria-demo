name: Quitar título redundante

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-builder-title.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Quitar título redundante
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_section = '<section class="builder-section is-hidden" id="builderSection" aria-labelledby="builderTitle">'
          new_section = '<section class="builder-section is-hidden" id="builderSection" aria-label="Crear mi proyección">'

          old_title = '''            <h2 class="section-statement" id="builderTitle">
              <span>Registra lo que tienes hoy.</span>
              <span>Proyecta lo que viene.</span>
            </h2>
'''

          if old_section not in text:
              raise SystemExit("No se encontró la sección esperada")
          if old_title not in text:
              raise SystemExit("No se encontró el título esperado")

          text = text.replace(old_section, new_section, 1)
          text = text.replace(old_title, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Publicar cambio
        shell: bash
        run: |
          rm .github/workflows/remove-builder-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-builder-title.yml
          git commit -m "Quita título redundante del creador de proyección"
          git push
