name: Treasury regression tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check accounting.js
          node --check app.js
          node --check excel-export.js
          node --check treasury-import.js
          node --check treasury-import-worker.js
      - name: Run complete regression suite
        run: node --test tests/*.test.cjs
