name: Aplicar escala adaptativa de la gráfica

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-adaptive-chart-scale.yml

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Aplicar nueva lógica y controles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("app.js")
          index_path = Path("index.html")
          css_path = Path("styles.css")
          readme_path = Path("README.md")

          app = app_path.read_text(encoding="utf-8")
          index = index_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")
          readme = readme_path.read_text(encoding="utf-8")

          # Estado y referencias de la interfaz.
          old_state = '''  includePending: true,
  custom: loadCustomState(),'''
          new_state = '''  includePending: true,
  chartScaleMode: "auto",
  custom: loadCustomState(),'''
          if old_state not in app:
              raise SystemExit("No se encontró el bloque de estado esperado")
          app = app.replace(old_state, new_state, 1)

          old_refs = '''  pendingAmount: document.querySelector("#pendingAmount"),
  forecastChart: document.querySelector("#forecastChart"),'''
          new_refs = '''  pendingAmount: document.querySelector("#pendingAmount"),
  chartScaleAuto: document.querySelector("#chartScaleAuto"),
  chartScaleZero: document.querySelector("#chartScaleZero"),
  forecastChart: document.querySelector("#forecastChart"),'''
          if old_refs not in app:
              raise SystemExit("No se encontró el bloque de referencias esperado")
          app = app.replace(old_refs, new_refs, 1)

          # Reemplazar la escala basada en movimientos por una escala basada en saldos acumulados.
          new_chart_block = r'''function niceCeiling(value) {
  if (!Number.isFinite(value) || value <= 0) {
    return 1;
  }

  const exponent = Math.floor(Math.log10(value));
  const magnitude = 10 ** exponent;
  const fraction = value / magnitude;
  let niceFraction;

  if (fraction <= 1) {
    niceFraction = 1;
  } else if (fraction <= 2) {
    niceFraction = 2;
  } else if (fraction <= 2.5) {
    niceFraction = 2.5;
  } else if (fraction <= 5) {
    niceFraction = 5;
  } else {
    niceFraction = 10;
  }

  return niceFraction * magnitude;
}

function nextNiceStep(step) {
  return niceCeiling(step * 1.0000001);
}

function roundTickValue(value, step) {
  const exponent = Math.floor(Math.log10(Math.abs(step) || 1));
  const precision = Math.max(0, Math.min(10, -exponent + 4));
  const rounded = Number(value.toFixed(precision));
  return Object.is(rounded, -0) ? 0 : rounded;
}

function buildTickValues(yMin, yMax, step) {
  const intervalCount = Math.max(1, Math.round((yMax - yMin) / step));
  return Array.from({ length: intervalCount + 1 }, (_, index) =>
    roundTickValue(yMin + index * step, step),
  );
}

function shouldIncludeZero(rawMin, rawMax, rawRange) {
  if (state.chartScaleMode === "zero") {
    return true;
  }

  if (rawMin <= 0 || rawMax <= 0) {
    return true;
  }

  const maxAbsoluteBalance = Math.max(Math.abs(rawMin), Math.abs(rawMax));
  if (maxAbsoluteBalance <= 10000) {
    return true;
  }

  const distanceToZero = Math.min(Math.abs(rawMin), Math.abs(rawMax));
  return distanceToZero <= Math.max(rawRange * 0.25, 1000);
}

function getChartScale(series) {
  const balances = series.map((point) => point.balance).filter(Number.isFinite);
  const rawMin = Math.min(...balances);
  const rawMax = Math.max(...balances);
  const rawRange = rawMax - rawMin;
  const includeZero = shouldIncludeZero(rawMin, rawMax, rawRange);

  let paddedMin;
  let paddedMax;

  if (rawRange === 0) {
    const reference = Math.max(Math.abs(rawMin), 1);
    const halfSpan = Math.max(reference * 0.06, reference <= 10000 ? 500 : 1);
    paddedMin = rawMin - halfSpan;
    paddedMax = rawMax + halfSpan;
  } else {
    const padding = rawRange * 0.12;
    paddedMin = rawMin - padding;
    paddedMax = rawMax + padding;
  }

  if (includeZero) {
    paddedMin = Math.min(paddedMin, 0);
    paddedMax = Math.max(paddedMax, 0);
  }

  const maxAbsoluteBalance = Math.max(Math.abs(rawMin), Math.abs(rawMax));

  // Para escenarios pequeños, conservar referencias financieras muy fáciles de leer.
  if (includeZero && maxAbsoluteBalance <= 10000) {
    const step = 5000;
    let yMin = Math.floor(paddedMin / step) * step;
    let yMax = Math.ceil(paddedMax / step) * step;

    if (rawMin >= 0) {
      yMin = 0;
      yMax = Math.max(10000, yMax);
    } else if (rawMax <= 0) {
      yMax = 0;
      yMin = Math.min(-10000, yMin);
    } else {
      if (yMin === 0) yMin = -step;
      if (yMax === 0) yMax = step;
    }

    let tickValues = buildTickValues(yMin, yMax, step);
    while (tickValues.length < 4) {
      if (Math.abs(rawMin) > Math.abs(rawMax)) {
        yMin -= step;
      } else {
        yMax += step;
      }
      tickValues = buildTickValues(yMin, yMax, step);
    }

    return { yMin, yMax, step, tickValues, includesZero: true };
  }

  const desiredIntervals = 4;
  let step = niceCeiling((paddedMax - paddedMin) / desiredIntervals);

  function calculateBounds(currentStep) {
    let yMin = Math.floor(paddedMin / currentStep) * currentStep;
    let yMax = Math.ceil(paddedMax / currentStep) * currentStep;

    if (includeZero && rawMin >= 0) {
      yMin = 0;
    }
    if (includeZero && rawMax <= 0) {
      yMax = 0;
    }
    if (yMin === yMax) {
      yMin -= currentStep;
      yMax += currentStep;
    }

    return {
      yMin: roundTickValue(yMin, currentStep),
      yMax: roundTickValue(yMax, currentStep),
    };
  }

  let { yMin, yMax } = calculateBounds(step);
  let tickValues = buildTickValues(yMin, yMax, step);

  // Mantener un máximo de cinco líneas horizontales relevantes.
  for (let guard = 0; tickValues.length > 5 && guard < 12; guard += 1) {
    step = nextNiceStep(step);
    ({ yMin, yMax } = calculateBounds(step));
    tickValues = buildTickValues(yMin, yMax, step);
  }

  // Evitar escalas demasiado vacías: ampliar un extremo hasta tener al menos cuatro marcas.
  for (let guard = 0; tickValues.length < 4 && guard < 4; guard += 1) {
    if (includeZero && yMin === 0 && rawMin >= 0) {
      yMax += step;
    } else if (includeZero && yMax === 0 && rawMax <= 0) {
      yMin -= step;
    } else {
      const lowerSpace = rawMin - yMin;
      const upperSpace = yMax - rawMax;
      if (lowerSpace <= upperSpace) {
        yMin -= step;
      } else {
        yMax += step;
      }
    }
    yMin = roundTickValue(yMin, step);
    yMax = roundTickValue(yMax, step);
    tickValues = buildTickValues(yMin, yMax, step);
  }

  return { yMin, yMax, step, tickValues, includesZero: yMin <= 0 && yMax >= 0 };
}

function formatChartAxisValue(value) {
  const normalized = Math.abs(value) < 0.000001 ? 0 : value;

  if (Math.abs(normalized) >= 1000000) {
    return compactCurrency.format(normalized);
  }

  return new Intl.NumberFormat("es-MX", {
    style: "currency",
    currency: "MXN",
    maximumFractionDigits: Math.abs(normalized) < 100 ? 2 : 0,
  }).format(normalized);
}

function updateChartScaleControls() {
  const automatic = state.chartScaleMode === "auto";
  els.chartScaleAuto.classList.toggle("is-active", automatic);
  els.chartScaleZero.classList.toggle("is-active", !automatic);
  els.chartScaleAuto.setAttribute("aria-pressed", String(automatic));
  els.chartScaleZero.setAttribute("aria-pressed", String(!automatic));
}

function setChartScaleMode(mode) {
  state.chartScaleMode = mode === "zero" ? "zero" : "auto";
  updateChartScaleControls();
  renderDashboard();
}

function renderChart(series, options = {}) {
  updateChartScaleControls();

  if (!options.hasData) {
    els.forecastChart.setAttribute(
      "aria-label",
      "La proyección todavía no contiene saldos ni movimientos.",
    );
    els.forecastChart.innerHTML = `
      <text class="chart-empty-title" x="500" y="148" text-anchor="middle">
        Agrega el saldo de al menos un banco
      </text>
      <text class="chart-empty-copy" x="500" y="180" text-anchor="middle">
        o registra un cobro o pago para generar la proyección.
      </text>
    `;
    return;
  }

  els.forecastChart.setAttribute(
    "aria-label",
    `Gráfica del saldo proyectado con escala ${
      state.chartScaleMode === "auto" ? "automática" : "desde cero"
    }`,
  );

  const width = 1000;
  const height = 340;
  const margin = { top: 24, right: 24, bottom: 48, left: 98 };
  const plotWidth = width - margin.left - margin.right;
  const plotHeight = height - margin.top - margin.bottom;
  const { yMin, yMax, tickValues } = getChartScale(series);

  const x = (day) => margin.left + (day / state.horizon) * plotWidth;
  const y = (balance) => margin.top + ((yMax - balance) / (yMax - yMin || 1)) * plotHeight;

  const linePath = series
    .map((point, index) => `${index === 0 ? "M" : "L"} ${x(point.day).toFixed(2)} ${y(point.balance).toFixed(2)}`)
    .join(" ");

  const areaBaselineValue = yMin <= 0 && yMax >= 0 ? 0 : yMin;
  const areaBaselineY = y(areaBaselineValue);
  const areaPath = `${linePath} L ${x(state.horizon)} ${areaBaselineY} L ${x(0)} ${areaBaselineY} Z`;

  const gridLines = tickValues
    .map((value) => {
      const yPosition = y(value);
      const zeroClass = value === 0 ? " chart-zero-line" : "";
      return `
        <line class="chart-grid-line${zeroClass}" x1="${margin.left}" y1="${yPosition}" x2="${width - margin.right}" y2="${yPosition}" />
        <text class="chart-axis-label" x="${margin.left - 12}" y="${yPosition + 4}" text-anchor="end">${formatChartAxisValue(value)}</text>
      `;
    })
    .join("");

  const preferredLabels = state.horizon === 7 ? 7 : state.horizon === 14 ? 7 : 6;
  const xTickStep = Math.max(1, Math.round(state.horizon / preferredLabels));
  const xLabels = series
    .filter((point) => point.day === 0 || point.day === state.horizon || point.day % xTickStep === 0)
    .map(
      (point) => `
        <text class="chart-axis-label" x="${x(point.day)}" y="${height - 16}" text-anchor="middle">
          ${point.day === 0 ? "Hoy" : shortDate.format(point.date)}
        </text>
      `,
    )
    .join("");

  const eventMarkers = series
    .filter((point) => point.movements.length > 0)
    .map((point) => {
      const hasInflow = point.movements.some((movement) => movement.type === "inflow");
      const hasOutflow = point.movements.some((movement) => movement.type === "outflow");
      const markers = [];

      if (hasInflow) {
        markers.push(`<circle class="chart-event-in" cx="${x(point.day)}" cy="${y(point.balance) - 13}" r="5" />`);
      }
      if (hasOutflow) {
        markers.push(`<circle class="chart-event-out" cx="${x(point.day)}" cy="${y(point.balance) + 13}" r="5" />`);
      }
      return markers.join("");
    })
    .join("");

  const points = series
    .filter((point) => point.day === 0 || point.day === state.horizon || point.movements.length > 0)
    .map((point) => `<circle class="chart-point" cx="${x(point.day)}" cy="${y(point.balance)}" r="5" />`)
    .join("");

  els.forecastChart.innerHTML = `
    <defs>
      <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#2463db" stop-opacity="0.20" />
        <stop offset="100%" stop-color="#2463db" stop-opacity="0.02" />
      </linearGradient>
    </defs>
    ${gridLines}
    <line class="chart-today-line" x1="${x(0)}" y1="${margin.top}" x2="${x(0)}" y2="${margin.top + plotHeight}" />
    <path class="chart-area" d="${areaPath}" />
    <path class="chart-line" d="${linePath}" />
    ${points}
    ${eventMarkers}
    ${xLabels}
  `;
}'''

          pattern = r'function niceCeiling\(value\) \{.*?\n\}\n\nfunction renderDashboard\(\) \{'
          app, count = re.subn(
              pattern,
              new_chart_block + '\n\nfunction renderDashboard() {',
              app,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Se esperaba reemplazar un bloque de gráfica; se reemplazaron {count}")

          old_render_call = '''  renderMovements(filteredMovements);
  renderChart(forecastSeries);'''
          new_render_call = '''  renderMovements(filteredMovements);
  const hasChartData = startingBalance !== 0 || filteredMovements.length > 0;
  renderChart(forecastSeries, { hasData: hasChartData });'''
          if old_render_call not in app:
              raise SystemExit("No se encontró la llamada de render esperada")
          app = app.replace(old_render_call, new_render_call, 1)

          old_listener_anchor = '''  els.bankCount.addEventListener("change", (event) => syncBankCount(event.target.value));'''
          new_listener_block = '''  els.chartScaleAuto.addEventListener("click", () => setChartScaleMode("auto"));
  els.chartScaleZero.addEventListener("click", () => setChartScaleMode("zero"));

  els.bankCount.addEventListener("change", (event) => syncBankCount(event.target.value));'''
          if old_listener_anchor not in app:
              raise SystemExit("No se encontró el ancla de eventos esperada")
          app = app.replace(old_listener_anchor, new_listener_block, 1)

          # Controles de escala en la cabecera de la gráfica.
          old_forecast_actions = '''              <div class="legend" aria-label="Leyenda de la gráfica">
                <span><i class="legend-line"></i> Saldo proyectado</span>
                <span><i class="legend-dot legend-dot-in"></i> Cobro</span>
                <span><i class="legend-dot legend-dot-out"></i> Pago</span>
              </div>'''
          new_forecast_actions = '''              <div class="forecast-heading-actions">
                <div class="scale-control" role="group" aria-label="Escala vertical de la gráfica">
                  <span class="scale-control-label">Escala</span>
                  <div class="scale-buttons">
                    <button
                      class="scale-button is-active"
                      id="chartScaleAuto"
                      type="button"
                      aria-pressed="true"
                      title="Ajusta el eje al saldo mínimo y máximo proyectado"
                    >Automática</button>
                    <button
                      class="scale-button"
                      id="chartScaleZero"
                      type="button"
                      aria-pressed="false"
                      title="Muestra la magnitud completa tomando el cero como referencia"
                    >Desde cero</button>
                  </div>
                </div>
                <div class="legend" aria-label="Leyenda de la gráfica">
                  <span><i class="legend-line"></i> Saldo proyectado</span>
                  <span><i class="legend-dot legend-dot-in"></i> Cobro</span>
                  <span><i class="legend-dot legend-dot-out"></i> Pago</span>
                </div>
              </div>'''
          if old_forecast_actions not in index:
              raise SystemExit("No se encontró la cabecera de gráfica esperada")
          index = index.replace(old_forecast_actions, new_forecast_actions, 1)

          css_addition = r'''

/* Controles y lectura de la escala del forecast */
.forecast-heading-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.scale-control {
  display: inline-flex;
  align-items: center;
  gap: 9px;
}

.scale-control-label {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.scale-buttons {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--canvas);
}

.scale-button {
  min-height: 32px;
  padding: 0 10px;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
}

.scale-button:hover {
  color: var(--ink);
}

.scale-button.is-active {
  background: white;
  color: var(--blue-deep);
  box-shadow: 0 2px 8px rgba(20, 35, 59, 0.08);
}

.chart-zero-line {
  stroke: #b6c1cf;
  stroke-width: 1.7;
}

.chart-empty-title {
  fill: var(--ink);
  font-family: "Sora", sans-serif;
  font-size: 20px;
  font-weight: 600;
}

.chart-empty-copy {
  fill: var(--muted);
  font-family: "Public Sans", sans-serif;
  font-size: 14px;
}

@media (max-width: 760px) {
  .forecast-heading-actions {
    width: 100%;
    align-items: flex-start;
  }

  .scale-control {
    width: 100%;
    justify-content: space-between;
  }

  .legend {
    justify-content: flex-start;
  }
}

@media (max-width: 460px) {
  .scale-control {
    align-items: flex-start;
    flex-direction: column;
  }
}
'''
          if "/* Controles y lectura de la escala del forecast */" not in css:
              css += css_addition

          readme_addition = '''

## Escala de la gráfica

La escala vertical se construye a partir del **saldo mínimo y máximo acumulado de la proyección**, no del tamaño aislado de cada cobro o pago.

- **Automática:** agrega un margen visual aproximado de 12 %, redondea límites e intervalos a cifras financieras legibles y muestra el cero únicamente cuando aporta contexto de riesgo o los saldos son pequeños.
- **Desde cero:** mantiene el cero como referencia para dimensionar la magnitud total de la caja.
- Utiliza entre cuatro y cinco marcas principales cuando el rango lo permite.
- No fuerza simetría entre valores positivos y negativos.
- Cuando el escenario personal no contiene saldos ni movimientos, muestra un estado vacío en lugar de una escala arbitraria.
'''
          if "## Escala de la gráfica" not in readme:
              readme += readme_addition

          app_path.write_text(app, encoding="utf-8")
          index_path.write_text(index, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Validar JavaScript
        run: node --check app.js

      - name: Retirar flujo temporal y publicar cambios
        shell: bash
        run: |
          rm .github/workflows/apply-adaptive-chart-scale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css README.md .github/workflows/apply-adaptive-chart-scale.yml
          git commit -m "Implementa escala financiera adaptativa"
          git push
