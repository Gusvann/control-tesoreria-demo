name: Aplicar escala adaptativa de la gráfica

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_adaptive_scale.py
      - .github/workflows/apply-adaptive-chart-scale.yml

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Aplicar parche
        run: python3 scripts/apply_adaptive_scale.py

      - name: Validar JavaScript
        run: node --check app.js

      - name: Publicar cambios
        run: |
          rm scripts/apply_adaptive_scale.py
          rm .github/workflows/apply-adaptive-chart-scale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css README.md scripts/apply_adaptive_scale.py .github/workflows/apply-adaptive-chart-scale.yml
          git commit -m "Implementa escala financiera adaptativa"
          git push
